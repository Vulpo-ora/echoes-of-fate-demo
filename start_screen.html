<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>命定·回响 Echoes of Fate</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#05060f; font-family:"PingFang SC","Microsoft YaHei",serif; }
  #app { position:fixed; inset:0; }

  /* ===== 开场动画层 ===== */
  #intro { position:absolute; inset:0; z-index:20;
    background:radial-gradient(ellipse at 50% 40%, #101a3a 0%, #070a1c 55%, #04050d 100%);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    transition:opacity 1.4s ease; }
  #intro.hide { opacity:0; pointer-events:none; }
  #starCanvas { position:absolute; inset:0; }

  /* 中央星轨光核 */
  .core { position:absolute; top:38%; left:50%; transform:translate(-50%,-50%);
    width:6px; height:6px; border-radius:50%; background:#fff;
    box-shadow:0 0 20px 6px #cfe0ff, 0 0 60px 18px rgba(120,160,255,.6);
    opacity:0; animation:coreIn 1.2s ease .3s forwards; }
  @keyframes coreIn { to { opacity:1; } }

  /* 旋转星轨环 */
  .orbit { position:absolute; top:38%; left:50%; border:1px solid rgba(150,180,255,.35);
    border-radius:50%; transform:translate(-50%,-50%) rotate(0deg); opacity:0; }
  .orbit.o1 { width:180px; height:180px; animation:orbitIn 1.4s ease .6s forwards, spin 14s linear infinite; }
  .orbit.o2 { width:320px; height:320px; border-color:rgba(150,180,255,.2); animation:orbitIn 1.4s ease .9s forwards, spinR 22s linear infinite; }
  .orbit.o3 { width:480px; height:480px; border-color:rgba(150,180,255,.12); animation:orbitIn 1.6s ease 1.2s forwards, spin 34s linear infinite; }
  @keyframes orbitIn { to { opacity:1; } }
  @keyframes spin  { to { transform:translate(-50%,-50%) rotate(360deg); } }
  @keyframes spinR { to { transform:translate(-50%,-50%) rotate(-360deg); } }

  /* 环上的星点 */
  .orbit::before { content:""; position:absolute; top:-4px; left:50%; width:8px; height:8px; margin-left:-4px;
    border-radius:50%; background:#dfe9ff; box-shadow:0 0 12px 4px rgba(180,200,255,.8); }

  /* 文案 */
  .titleWrap { position:absolute; top:58%; left:50%; transform:translate(-50%,-50%); text-align:center; width:90%; }
  .title { font-size:clamp(38px,9vw,84px); font-weight:700; letter-spacing:.15em; color:#fff;
    text-shadow:0 0 24px rgba(150,190,255,.8),0 0 48px rgba(110,150,255,.5);
    opacity:0; transform:translateY(18px); animation:riseIn 1.6s ease 1.8s forwards; }
  .en { font-size:clamp(13px,2.6vw,20px); letter-spacing:.42em; color:#9fb6ff; margin-top:14px;
    opacity:0; animation:fadeIn 1.6s ease 2.4s forwards; }
  .slogan { font-size:clamp(12px,2.4vw,16px); color:#c9d6ff; margin-top:26px; line-height:2; letter-spacing:.08em;
    opacity:0; animation:fadeIn 2s ease 3s forwards; }
  .enterBtn { margin-top:40px; padding:13px 46px; border:1px solid rgba(160,190,255,.6); border-radius:40px;
    background:rgba(120,150,255,.08); color:#e6ecff; font-size:16px; letter-spacing:.3em; cursor:pointer;
    opacity:0; animation:fadeIn 1.4s ease 3.8s forwards; transition:all .3s; backdrop-filter:blur(4px); }
  .enterBtn:hover { background:rgba(140,170,255,.25); box-shadow:0 0 24px rgba(140,170,255,.5); transform:translateY(-2px); }
  @keyframes riseIn { to { opacity:1; transform:translateY(0);} }
  @keyframes fadeIn { to { opacity:1; } }

  .skip { position:absolute; right:26px; bottom:24px; color:rgba(200,210,255,.5); font-size:13px;
    letter-spacing:.2em; cursor:pointer; z-index:22; opacity:0; animation:fadeIn 1s ease 2s forwards; }
  .skip:hover { color:#fff; }

  /* ===== 游戏界面占位层 ===== */
  #game { position:absolute; inset:0; z-index:10; opacity:0; pointer-events:none;
    background:radial-gradient(ellipse at 50% 30%, #16213f 0%, #0a0e20 60%, #060810 100%);
    display:flex; align-items:center; justify-content:center; transition:opacity 1.4s ease; }
  #game.show { opacity:1; pointer-events:auto; }
  .gCard { text-align:center; color:#dfe6ff; }
  .gCard h2 { font-size:30px; letter-spacing:.12em; margin-bottom:14px; text-shadow:0 0 20px rgba(150,190,255,.6); }
  .gCard p { color:#98a6d8; letter-spacing:.06em; }
</style>
</head>
<body>
<div id="app">
  <!-- 开场动画 -->
  <section id="intro">
    <canvas id="starCanvas"></canvas>
    <div class="core"></div>
    <div class="orbit o1"></div>
    <div class="orbit o2"></div>
    <div class="orbit o3"></div>
    <div class="titleWrap">
      <div class="title">命定 · 回响</div>
      <div class="en">ECHOES&nbsp;OF&nbsp;FATE</div>
      <div class="slogan">有些故事，只有经历过才懂。<br>有些宿命，只有说出来才存在。</div>
      <button class="enterBtn" id="enterBtn">进 入 星 轨</button>
    </div>
    <div class="skip" id="skipBtn">跳过 ▸</div>
  </section>

  <!-- 游戏界面（占位，后续接入开局流程） -->
  <section id="game">
    <div class="gCard">
      <h2>星轨已连接</h2>
      <p>——此处衔接：选世界观 → 选角色 → 人设问答——</p>
    </div>
  </section>
</div>

<script>
(function(){
  // ===== 星空粒子 + 星轨流星 =====
  const cv = document.getElementById('starCanvas');
  const ctx = cv.getContext('2d');
  let W, H, stars = [], shooting = [];
  function resize(){ W = cv.width = innerWidth; H = cv.height = innerHeight; }
  resize(); addEventListener('resize', resize);

  // 背景星点
  for(let i=0;i<180;i++){
    stars.push({ x:Math.random()*W, y:Math.random()*H,
      r:Math.random()*1.4+.3, a:Math.random(), s:Math.random()*.02+.005 });
  }
  const cx = ()=>W*0.5, cy = ()=>H*0.38; // 星轨中心

  function spawnShoot(){
    // 从边缘飞向中心的"命运星轨"流星
    const ang = Math.random()*Math.PI*2, dist = Math.max(W,H)*0.7;
    shooting.push({
      x: cx()+Math.cos(ang)*dist, y: cy()+Math.sin(ang)*dist,
      tx: cx(), ty: cy(), life:0, dur: 60+Math.random()*30
    });
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    // 闪烁星点
    stars.forEach(st=>{
      st.a += st.s; if(st.a>1||st.a<0) st.s*=-1;
      ctx.beginPath(); ctx.arc(st.x,st.y,st.r,0,7);
      ctx.fillStyle='rgba(200,215,255,'+Math.abs(st.a)+')'; ctx.fill();
    });
    // 汇聚流星
    shooting.forEach(sh=>{
      sh.life++;
      const t = sh.life/sh.dur;
      const x = sh.x+(sh.tx-sh.x)*t, y = sh.y+(sh.ty-sh.y)*t;
      const px = sh.x+(sh.tx-sh.x)*(t-.06), py = sh.y+(sh.ty-sh.y)*(t-.06);
      const g = ctx.createLinearGradient(px,py,x,y);
      g.addColorStop(0,'rgba(150,180,255,0)');
      g.addColorStop(1,'rgba(210,225,255,'+(1-t)+')');
      ctx.strokeStyle=g; ctx.lineWidth=2; ctx.beginPath();
      ctx.moveTo(px,py); ctx.lineTo(x,y); ctx.stroke();
    });
    shooting = shooting.filter(s=>s.life<s.dur);
    if(Math.random()<0.08) spawnShoot();
    requestAnimationFrame(draw);
  }
  draw();

  // ===== 进入游戏 =====
  const intro = document.getElementById('intro');
  const game  = document.getElementById('game');
  let entered = false;
  function enter(){
    if(entered) return; entered = true;
    intro.classList.add('hide');
    setTimeout(()=>{ game.classList.add('show'); }, 700);
  }
  document.getElementById('enterBtn').onclick = enter;
  document.getElementById('skipBtn').onclick  = enter;
  // 动画播完约 6s 自动进入（仍可提前点击）
  setTimeout(enter, 6500);
})();
</script>
</body>
</html>
